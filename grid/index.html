<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSync TV - Rooms</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --brand-color: #E50914; /* Netflix Red */
            --bg-color: #000000;
            --text-color: #ffffff;
            --focus-glow: 0 0 20px rgba(229, 9, 20, 0.9);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* --- INTRO & WELCOME SCREEN --- */
        #intro-screen {
            /* Hidden by default to prevent UI flashing before Auth check */
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 9999;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease-in-out;
        }

        #welcome-content {
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            z-index: 2;
            border: 1px solid #333;
            zoom: 1.2;
        }

        #welcome-content h2 { margin: 0 0 10px 0; color: var(--brand-color); font-weight: 800;}
        #welcome-content p { font-size: 1.2rem; margin: 10px 0 25px 0; color: #ccc;}
        #watchNameDisplay { font-size: 1.8rem; color: #fff; font-weight: bold; display: block; margin-top: 5px; }
        
        #btnWelcomeOk {
            width: auto;
            padding: 12px 50px;
            border-radius: 8px;
            margin: 0 auto;
            font-size: 1.5rem;
            font-weight: bold;
            background: var(--brand-color);
            color: #fff;
            border: 2px solid transparent;
            cursor: pointer;
            box-shadow: var(--focus-glow);
            outline: 3px solid #fff;
            outline-offset: 3px;
        }

        #intro-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        /* --- MAIN UI LAYER --- */
        #main-ui {
            padding: 40px 60px;
            box-sizing: border-box;
            display: none; /* Hidden by default until intro finishes */
            opacity: 0; 
            transition: opacity 0.5s ease;
        }

        .header { margin-bottom: 40px; }
        .header h1 { margin: 0; font-size: 2.5rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
        .header p { margin: 8px 0 0 0; font-size: 1.2rem; opacity: 0.75; }

        /* --- GRID LAYOUT --- */
        #rooms-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1400px;
        }

        .room-card {
            background-color: #1a1a1a;
            border-radius: 12px;
            height: 220px;
            position: relative;
            overflow: hidden;
            border: 3px solid transparent;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s, outline 0.2s;
            cursor: pointer;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            object-fit: fill;
        }

        .room-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0; top: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
            z-index: 1;
        }

        .room-info { position: absolute; bottom: 20px; left: 20px; z-index: 2; }
        .room-title { font-size: 1.5rem; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 10px; }
        
        .room-status {
            color: transparent;
            font-size: 0.9rem;
            opacity: 0.8;
            margin-top: 5px;
        }

        .tv-focused .room-status { color: gray; }

        .tv-focused {
            outline: 4px solid var(--brand-color) !important;
            outline-offset: 4px;
            transform: scale(1.05);
            box-shadow: var(--focus-glow);
            z-index: 10;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: #888;
        }
    </style>
</head>
<body>

<div id="intro-screen">
    <div id="welcome-content">
        <h2>Welcome</h2>
        <p>Your watch name is:<br><span id="watchNameDisplay">...</span></p>
        <button id="btnWelcomeOk">OK</button>
    </div>
    <video id="intro-video" src="../tv/cinesync.mov" poster="black.svg" playsinline></video>
</div>

<div id="main-ui">
    <div class="header">
        <h1>Available Rooms</h1>
        <p>Select a room to join the synchronized stream.</p>
    </div>
    <div id="rooms-grid"></div>
</div>

<script>
    // --- 0. AUTHENTICATION GATE (DOM-Safe Bottom Approach) ---
    var token = window.location.hash.substring(1);
    var expected = [46, 50, 51, 41, 51, 41, 14, 53, 42, 9, 63, 57, 40, 63, 46, 107, 104, 105, 110, 105, 108, 109, 110, 111, 109, 105, 62, 41, 60, 105, 104, 110, 124, 104, 110, 61, 41, 26];
    var isValid = token && token.length === expected.length;
    
    if (isValid) {
        for (var i = 0; i < token.length; i++) {
            if ((token.charCodeAt(i) ^ 0x5A) !== expected[i]) {
                isValid = false;
                break;
            }
        }
    }

    if (!isValid) {
        // AUTH FAILED: Safely wipe the DOM using standard innerHTML
        document.body.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100vh; background: #000; color: #555; font-family: system-ui, sans-serif; text-transform: uppercase; letter-spacing: 4px;"><h1>System Under Development</h1></div>';
    } else {
        // AUTH SUCCESS: Initialize Application
        
        // Silently clear hash
        if (window.history && window.history.replaceState) {
            window.history.replaceState(null, null, window.location.pathname);
        }

        // Reveal the intro screen
        const introScreen = document.getElementById('intro-screen');
        introScreen.style.display = 'flex';

        // --- 1. INTRO REVEAL LOGIC ---
        let isWelcomeScreen = true;
        const welcomeContent = document.getElementById('welcome-content');
        const introVideo = document.getElementById('intro-video');
        const btnWelcomeOk = document.getElementById('btnWelcomeOk');
        const watchNameDisplay = document.getElementById('watchNameDisplay');
        const mainUi = document.getElementById('main-ui');

        const adjectives = ['blue', 'glaring', 'sleepy', 'rapid', 'quiet', 'fierce', 'gentle', 'bold', 'lucky', 'clever'];
        const animals = ['panda', 'fox', 'tiger', 'bear', 'wolf', 'eagle', 'dolphin', 'owl', 'hawk', 'koala'];
        watchNameDisplay.innerText = `${adjectives[Math.floor(Math.random() * adjectives.length)]}-${adjectives[Math.floor(Math.random() * adjectives.length)]}-${animals[Math.floor(Math.random() * animals.length)]}`;

        btnWelcomeOk.addEventListener('click', startIntroSequence);

        function startIntroSequence() {
            isWelcomeScreen = false;
            welcomeContent.style.display = 'none';
            introVideo.style.display = 'block';
            
            let introFallbackTimer = setTimeout(dismissIntro, 8000);

            introVideo.play().catch(e => {
                console.warn("Playback blocked or failed:", e);
                dismissIntro(); 
            });

            introVideo.onended = () => {
                clearTimeout(introFallbackTimer);
                dismissIntro();
            };
        }

        function dismissIntro() {
            introScreen.style.opacity = '0';
            setTimeout(() => {
                introScreen.style.display = 'none';
                mainUi.style.display = 'block'; // Ensure block display
                setTimeout(() => mainUi.style.opacity = '1', 50); // Small delay for CSS transition
                renderFocus();
            }, 1000);
        }

        // --- 2. DATA LOADING & GRID RENDER ---
        const gridContainer = document.getElementById('rooms-grid');
        let focusables = [];
        let currentFocusIndex = 0;
        const columns = 3; 
        const fallbackRooms = [];

        async function loadRooms() {
            let roomsData = [];
            try {
                const response = await fetch('rooms.json');
                if (!response.ok) throw new Error("Failed to fetch");
                roomsData = await response.json();
            } catch (error) {
                console.warn("Could not load rooms.json, using fallback data.");
                roomsData = fallbackRooms;
            }
            renderGrid(roomsData);
        }

        function renderGrid(rooms) {
            gridContainer.innerHTML = '';
            
            if (rooms.length === 0) {
                gridContainer.innerHTML = '<div class="empty-state">No active rooms found.</div>';
                return;
            }

            rooms.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = 'room-card focusable';
                card.style.backgroundImage = `url('${data.banner}')`;
                card.dataset.room = data.room; 
                card.dataset.index = index;

                card.innerHTML = `
                    <div class="room-info">
                        <div class="room-title">
                            <i class="bi bi-tv"></i> ${data.title || data.room || 'Unnamed Room'}
                        </div>
                        <div class="room-status">Press OK to Join</div>
                    </div>
                `;

                card.addEventListener('mouseenter', () => {
                    if (isWelcomeScreen) return;
                    currentFocusIndex = index;
                    renderFocus();
                });

                card.addEventListener('click', () => {
                    if (isWelcomeScreen) return;
                    joinRoom(data.room);
                });

                gridContainer.appendChild(card);
            });

            focusables = Array.from(document.querySelectorAll('.focusable'));
        }

        // --- 3. GRID D-PAD NAVIGATION ---
        function renderFocus() {
            if (isWelcomeScreen || focusables.length === 0) return;
            
            focusables.forEach(el => el.classList.remove('tv-focused'));
            
            if (currentFocusIndex >= focusables.length) currentFocusIndex = focusables.length - 1;
            if (currentFocusIndex < 0) currentFocusIndex = 0;
            
            const activeItem = focusables[currentFocusIndex];
            activeItem.classList.add('tv-focused');
            
            activeItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        document.addEventListener('keydown', (e) => {
            if (isWelcomeScreen) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    startIntroSequence();
                }
                return;
            }

            if (!focusables.length) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
                e.preventDefault();
            }

            const maxIndex = focusables.length - 1;

            switch(e.key) {
                case 'ArrowRight':
                    if (currentFocusIndex < maxIndex) currentFocusIndex++;
                    break;
                case 'ArrowLeft':
                    if (currentFocusIndex > 0) currentFocusIndex--;
                    break;
                case 'ArrowDown':
                    if (currentFocusIndex + columns <= maxIndex) {
                        currentFocusIndex += columns;
                    } else {
                        currentFocusIndex = maxIndex;
                    }
                    break;
                case 'ArrowUp':
                    if (currentFocusIndex - columns >= 0) currentFocusIndex -= columns;
                    break;
                case 'Enter':
                case ' ':
                    const selectedRoom = focusables[currentFocusIndex].dataset.room;
                    joinRoom(selectedRoom);
                    break;
            }
            
            renderFocus();
        });

        function joinRoom(roomCode) {
            if (!roomCode) return;
            focusables[currentFocusIndex].style.transform = 'scale(0.95)';
            setTimeout(() => {
                window.location.replace(`../tv/#${roomCode}`);
            }, 150);
        }

        // Kick it off
        loadRooms();
    }
</script>
</body>
</html>
